name: Set up Node.js and pnpm
description: Install the requested Node.js version and activate pnpm
inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "24"
  pnpm-version:
    description: pnpm version to activate
    required: false
    default: "12.4.2"
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable pnpm
      shell: bash
      run: corepack enable && corepack prepare pnpm@${{ inputs.pnpm-version }} --activate