services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.14-bookworm
    working_dir: /workspaces/capstone
    command: sleep infinity
    volumes:
      - .:/workspaces/capstone:cached
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - capstone

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://capstone:capstone@postgres:5432/capstone
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app:cached
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - capstone

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/workspace/apps/web:cached
      - web_node_modules:/workspace/node_modules
      - web_app_node_modules:/workspace/apps/web/node_modules
    networks:
      - capstone

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - capstone

  redis:
    image: redis:8
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - capstone

volumes:
  api_venv:
  web_node_modules:
  web_app_node_modules:
  postgres_data:
  redis_data:

networks:
  capstone: