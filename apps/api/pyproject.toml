[project]
name = "capstone-api"
version = "0.1.0"
description = "FastAPI backend for the Capstone monorepo"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
